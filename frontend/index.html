<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coursewell — Course Content Platform</title>
    <!-- The actual font stylesheet is injected by
         shared/frontend-core/theme/applyBrand.ts, driven by
         brand.config.ts's fonts.googleFontsUrl — so changing fonts for
         a new client only requires editing that one file. These
         preconnects stay static since they just point at Google's font
         CDN, not a specific family. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body class="bg-paper-50 text-ink-900 font-body antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
